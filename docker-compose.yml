services:

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    container_name: server-intelligence-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8001:8000"

    

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OLLAMA_URL: "http://host.docker.internal:11434/api/chat"
      VICTORIAMETRICS_URL: "http://victoriametrics:8428"
      VICTORIALOGS_URL: "http://victorialogs:9428"
      FORWARD_TELEMETRY_URL: "${FORWARD_TELEMETRY_URL:-}"
      FORWARD_TELEMETRY_TOKEN: "${FORWARD_TELEMETRY_TOKEN:-}"
      TELEMETRY_SECRET_TOKEN: "${TELEMETRY_SECRET_TOKEN:-}"
      RENDER_TELEMETRY_URL: "${RENDER_TELEMETRY_URL:-}"

    depends_on:
      - victoriametrics
      - victorialogs


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"

    container_name: server-intelligence-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


  victoriametrics:
    image: victoriametrics/victoria-metrics:latest

    container_name: server-intelligence-victoriametrics

    restart: unless-stopped

    ports:
      - "8428:8428"

    volumes:
      - victoria-metrics-data:/victoria-metrics-data

    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=90d"

  
  victorialogs:
    image: victoriametrics/victoria-logs:latest

    container_name: server-intelligence-victorialogs

    restart: unless-stopped

    ports:
      - "9428:9428"

    volumes:
      - victoria-logs-data:/victoria-logs-data

    command:
      - "--storageDataPath=/victoria-logs-data"


  grafana:
    image: grafana/grafana:latest

    container_name: server-intelligence-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - victoriametrics


volumes:

  victoria-metrics-data:
    external: true
    name: victoriametrics_victoria-metrics-data

  victoria-logs-data:

  grafana-data:
    external: true
    name: server-intelligence-grafana-data
