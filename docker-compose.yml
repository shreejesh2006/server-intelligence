services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: server-intelligence-backend

    restart: unless-stopped
    
    env_file:
      - .env 
    ports:
      - "8000:8000"

    volumes:
      - ./backend/server_intelligence.db:/app/server_intelligence.db

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OLLAMA_URL: "http://host.docker.internal:11434/api/chat"
      VICTORIAMETRICS_URL: "http://host.docker.internal:8428"

    depends_on:
      - victoriametrics


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: server-intelligence-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


  victoriametrics:
    image: victoriametrics/victoria-metrics:latest

    container_name: server-intelligence-victoriametrics

    restart: unless-stopped

    ports:
      - "8428:8428"

    volumes:
      - victoria-metrics-data:/victoria-metrics-data

    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=90d"


  grafana:
    image: grafana/grafana:latest

    container_name: server-intelligence-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - victoriametrics


volumes:

  victoria-metrics-data:
    external: true
    name: victoriametrics_victoria-metrics-data

  grafana-data:
    external: true
    name: server-intelligence-grafana-data
