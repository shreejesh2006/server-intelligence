apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-intelligence-backend
  namespace: netra
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: netra-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: netra-intelligence
    spec:
      containers:
        - name: backend
          image: netra-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: netra-backend-config
            - secretRef:
                name: netra-backend-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: server-intelligence-db-app
                  key: uri
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: forward-spool
              mountPath: /app/forward_spool
      volumes:
        - name: forward-spool
          emptyDir: {}
