apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netra-collector
  namespace: netra
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/part-of: netra-intelligence
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
        app.kubernetes.io/part-of: netra-intelligence
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: collector
          image: netra-collector:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: netra-collector-config
          env:
            - name: TELEMETRY_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netra-backend-secrets
                  key: TELEMETRY_SECRET_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: spool-dir
              mountPath: /app/spool
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: spool-dir
          emptyDir: {}
