apiVersion: v1
kind: ConfigMap
metadata:
  name: netra-collector-config
  namespace: netra
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/part-of: netra-intelligence
data:
  MAC_RECEIVER_URL: "http://server-intelligence-backend.netra.svc.cluster.local:8000/api/v1/telemetry/ingest"
  COLLECTION_INTERVAL_SECONDS: "30"
  BATCH_SIZE: "10"
  SPOOL_DIR: "/app/spool"
  MAX_SPOOL_FILES: "288"
