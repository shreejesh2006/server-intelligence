apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-config
  namespace: netra
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/part-of: netra-intelligence
data:
  DB_HOST: "server-intelligence-db-rw.netra.svc.cluster.local"
  DB_NAME: "netbox"
  DB_USER: "netra"
  REDIS_HOST: "netbox-redis.netra.svc.cluster.local"
  REDIS_PORT: "6379"
  ALLOWED_HOSTS: "*"
  METRICS_ENABLED: "true"
