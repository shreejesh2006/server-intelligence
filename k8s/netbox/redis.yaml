apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-redis
  namespace: netra
  labels:
    app.kubernetes.io/name: netbox-redis
    app.kubernetes.io/part-of: netra-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-redis
        app.kubernetes.io/part-of: netra-intelligence
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-redis
  namespace: netra
  labels:
    app.kubernetes.io/name: netbox-redis
    app.kubernetes.io/part-of: netra-intelligence
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: netbox-redis
