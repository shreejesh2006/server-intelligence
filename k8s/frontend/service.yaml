apiVersion: v1
kind: Service
metadata:
  name: server-intelligence-frontend
  namespace: netra
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: netra-intelligence
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netra
  labels:
    app.kubernetes.io/name: backend-alias
    app.kubernetes.io/part-of: netra-intelligence
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
