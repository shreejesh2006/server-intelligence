apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-intelligence-frontend
  namespace: netra
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: netra-intelligence
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server-intelligence-frontend
                port:
                  number: 80
