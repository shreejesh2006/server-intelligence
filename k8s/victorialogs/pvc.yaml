  name: victorialogs-data
  namespace: netra
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/instance: victorialogs
    app.kubernetes.io/part-of: netra-intelligence
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 2Gi
