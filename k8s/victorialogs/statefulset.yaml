apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  namespace: netra
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/instance: victorialogs
    app.kubernetes.io/part-of: netra-intelligence
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
      app.kubernetes.io/instance: victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        app.kubernetes.io/instance: victorialogs
        app.kubernetes.io/part-of: netra-intelligence
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-logs-data"
            - "-retentionPeriod=90d"
            - "-httpListenAddr=:9428"
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: victorialogs-data
              mountPath: /victoria-logs-data
      volumes:
        - name: victorialogs-data
          persistentVolumeClaim:
            claimName: victorialogs-data
