apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: netra
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/instance: victoriametrics
    app.kubernetes.io/part-of: netra-intelligence
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
      app.kubernetes.io/instance: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/instance: victoriametrics
        app.kubernetes.io/part-of: netra-intelligence
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--storageDataPath=/victoria-metrics-data"
            - "--retentionPeriod=90d"
            - "--httpListenAddr=:8428"
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: victoriametrics-data
              mountPath: /victoria-metrics-data
      volumes:
        - name: victoriametrics-data
          persistentVolumeClaim:
            claimName: victoriametrics-data
