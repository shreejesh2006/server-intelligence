apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: server-intelligence-db
  namespace: netra
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: server-intelligence-db
    app.kubernetes.io/part-of: netra-intelligence
spec:
  instances: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  storage:
    size: 2Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: server_intelligence
      owner: netra

  imageName: ghcr.io/cloudnative-pg/postgresql:16
